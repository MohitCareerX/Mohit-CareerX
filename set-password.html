<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Set Password | MOHIT CAREERX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #071a3d;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .brand {
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 10px;
    }

    h1 {
      margin-top: 0;
      color: #071a3d;
    }

    p {
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">MOHIT CAREERX</div>

    <h1>🔐 Set Your Password</h1>

    <p>
      Your student account has been created successfully.
      Create a password below to access your student dashboard
      and enrolled courses.
    </p>

    <form id="passwordForm">

      <label for="password">
        New Password
      </label>

      <input
        id="password"
        type="password"
        minlength="6"
        placeholder="Enter new password"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        placeholder="Confirm password"
        autocomplete="new-password"
        required
      >

      <button id="saveBtn" type="submit">
        Set Password & Continue
      </button>

    </form>

    <div id="msg"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>

    const sb = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const form = document.getElementById("passwordForm");
    const password = document.getElementById("password");
    const confirmPassword =
      document.getElementById("confirmPassword");

    const saveBtn = document.getElementById("saveBtn");
    const msg = document.getElementById("msg");

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = type;
    }

    async function checkSession() {

      const { data, error } =
        await sb.auth.getSession();

      if (error || !data.session) {

        showMessage(
          "This invitation link is invalid or has expired. Please request a new account link.",
          "error"
        );

        saveBtn.disabled = true;

        return false;
      }

      return true;
    }

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const sessionOk = await checkSession();

      if (!sessionOk) {
        return;
      }

      const p1 = password.value.trim();
      const p2 = confirmPassword.value.trim();

      if (p1.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }

      if (p1 !== p2) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const { error } =
        await sb.auth.updateUser({
          password: p1
        });

      if (error) {

        showMessage(
          error.message,
          "error"
        );

        saveBtn.disabled = false;
        saveBtn.textContent =
          "Set Password & Continue";

        return;
      }

      showMessage(
        "Password created successfully. Redirecting to your dashboard...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1200);

    });

    checkSession();

  </script>

</body>
</html>
