<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Set Password | MOHIT CAREERX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #071a3d;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .brand {
      color: #2563eb;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 {
      color: #071a3d;
      margin: 0 0 12px;
    }

    p {
      color: #4b5563;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #status,
    #msg {
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.5;
    }

    #status {
      background: #eff6ff;
      color: #1d4ed8;
    }

    #msg {
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    #passwordForm {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="brand">MOHIT CAREERX</div>

  <h1>🔐 Create Your Password</h1>

  <p>
    Your student account invitation has been accepted.
    Create your password below to continue.
  </p>

  <div id="status">
    Processing your invitation...
  </div>

  <form id="passwordForm">

    <label for="password">New Password</label>

    <input
      id="password"
      type="password"
      minlength="6"
      autocomplete="new-password"
      placeholder="Enter your password"
      required
    >

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      id="confirmPassword"
      type="password"
      minlength="6"
      autocomplete="new-password"
      placeholder="Re-enter your password"
      required
    >

    <button id="saveBtn" type="submit">
      Create Password & Continue
    </button>

  </form>

  <div id="msg"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const sb = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const statusBox =
  document.getElementById("status");

const form =
  document.getElementById("passwordForm");

const password =
  document.getElementById("password");

const confirmPassword =
  document.getElementById("confirmPassword");

const saveBtn =
  document.getElementById("saveBtn");

const msg =
  document.getElementById("msg");


function message(text, type) {

  msg.textContent = text;
  msg.className = type;

}


function showForm() {

  statusBox.textContent =
    "✅ Invitation verified. Create your password.";

  statusBox.style.background = "#dcfce7";
  statusBox.style.color = "#166534";

  form.style.display = "block";

}


async function processInvitation() {

  try {

    /*
      Supabase invite links normally return
      authentication information in the URL.

      First check whether a session already exists.
    */

    let {
      data: sessionData,
      error: sessionError
    } = await sb.auth.getSession();

    if (sessionError) {
      console.error(sessionError);
    }

    if (sessionData?.session) {

      showForm();
      return;

    }


    /*
      Check URL hash manually.

      This is important because Supabase implicit
      authentication can return access_token and
      refresh_token in the URL fragment.
    */

    const hash =
      window.location.hash.substring(1);

    const hashParams =
      new URLSearchParams(hash);

    const accessToken =
      hashParams.get("access_token");

    const refreshToken =
      hashParams.get("refresh_token");

    const errorDescription =
      hashParams.get("error_description");

    if (errorDescription) {

      statusBox.textContent =
        decodeURIComponent(
          errorDescription.replace(/\+/g, " ")
        );

      statusBox.style.background = "#fee2e2";
      statusBox.style.color = "#991b1b";

      return;
    }


    if (accessToken && refreshToken) {

      const {
        data,
        error
      } = await sb.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      if (error) {

        console.error(
          "SET SESSION ERROR:",
          error
        );

        statusBox.textContent =
          error.message;

        statusBox.style.background =
          "#fee2e2";

        statusBox.style.color =
          "#991b1b";

        return;
      }

      if (data?.session) {

        showForm();
        return;

      }

    }


    /*
      Give Supabase one final chance to restore
      the session automatically.
    */

    await new Promise(
      resolve => setTimeout(resolve, 1000)
    );

    const {
      data: finalSession
    } = await sb.auth.getSession();

    if (finalSession?.session) {

      showForm();
      return;

    }


    statusBox.textContent =
      "❌ Invitation session was not found. Please open the latest invitation email again.";

    statusBox.style.background =
      "#fee2e2";

    statusBox.style.color =
      "#991b1b";


  } catch (error) {

    console.error(
      "INVITATION ERROR:",
      error
    );

    statusBox.textContent =
      error.message ||
      "Unable to process invitation.";

    statusBox.style.background =
      "#fee2e2";

    statusBox.style.color =
      "#991b1b";

  }

}


form.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    const p1 =
      password.value.trim();

    const p2 =
      confirmPassword.value.trim();


    if (p1.length < 6) {

      message(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    if (p1 !== p2) {

      message(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;

    saveBtn.textContent =
      "Creating Password...";


    try {

      const {
        data,
        error
      } = await sb.auth.updateUser({
        password: p1
      });


      if (error) {

        console.error(
          "UPDATE PASSWORD ERROR:",
          error
        );

        message(
          error.message,
          "error"
        );

        saveBtn.disabled = false;

        saveBtn.textContent =
          "Create Password & Continue";

        return;
      }


      console.log(
        "Password updated:",
        data
      );


      message(
        "✅ Password created successfully. Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 1200);


    } catch (error) {

      console.error(error);

      message(
        error.message ||
        "Password creation failed.",
        "error"
      );

      saveBtn.disabled = false;

      saveBtn.textContent =
        "Create Password & Continue";

    }

  }
);


processInvitation();

</script>

</body>
</html>
