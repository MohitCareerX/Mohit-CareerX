<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Set Password | MOHIT CAREERX
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #071a3d;
    }

    .card {

      width: 100%;

      max-width: 480px;

      background: white;

      padding: 30px;

      border-radius: 18px;

      box-shadow:
        0 20px 50px rgba(0,0,0,.25);
    }

    .brand {

      color: #2563eb;

      font-weight: 800;

      margin-bottom: 10px;
    }

    h1 {

      color: #071a3d;

      margin-bottom: 12px;
    }

    p {

      color: #4b5563;

      line-height: 1.6;
    }

    label {

      display: block;

      margin-top: 18px;

      margin-bottom: 7px;

      font-weight: 700;
    }

    input {

      width: 100%;

      padding: 14px;

      border:
        1px solid #d1d5db;

      border-radius: 10px;

      font-size: 16px;
    }

    button {

      width: 100%;

      margin-top: 22px;

      padding: 14px;

      border: 0;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;
    }

    button:disabled {

      opacity: .6;

      cursor: not-allowed;
    }

    #status {

      margin-top: 15px;

      padding: 13px;

      border-radius: 10px;

      background: #eff6ff;

      color: #1d4ed8;

      line-height: 1.5;
    }

    #msg {

      display: none;

      margin-top: 15px;

      padding: 13px;

      border-radius: 10px;

      line-height: 1.5;
    }

    #passwordForm {

      display: none;
    }

    .success {

      display: block !important;

      background: #dcfce7;

      color: #166534;
    }

    .error {

      display: block !important;

      background: #fee2e2;

      color: #991b1b;
    }

  </style>

</head>


<body>


<div class="card">

  <div class="brand">
    MOHIT CAREERX
  </div>

  <h1>
    🔐 Create Your Password
  </h1>

  <p>
    Your student account invitation has been accepted.
    Create your password below to continue.
  </p>

  <div id="status">
    Processing your invitation...
  </div>


  <form id="passwordForm">

    <label for="password">
      New Password
    </label>

    <input
      id="password"
      type="password"
      minlength="6"
      autocomplete="new-password"
      placeholder="Enter your password"
      required
    >


    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      id="confirmPassword"
      type="password"
      minlength="6"
      autocomplete="new-password"
      placeholder="Re-enter your password"
      required
    >


    <button
      id="saveBtn"
      type="submit"
    >
      Create Password & Continue
    </button>

  </form>


  <div id="msg"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const sb =
  window.supabase.createClient(

    window.MOHIT_CONFIG.SUPABASE_URL,

    window.MOHIT_CONFIG.SUPABASE_PUBLISHABLE_KEY,

    {
      auth: {

        persistSession: true,

        autoRefreshToken: true,

        detectSessionInUrl: true

      }
    }

  );


const statusBox =
  document.getElementById("status");

const form =
  document.getElementById("passwordForm");

const password =
  document.getElementById("password");

const confirmPassword =
  document.getElementById("confirmPassword");

const saveBtn =
  document.getElementById("saveBtn");

const msg =
  document.getElementById("msg");


function showForm() {

  statusBox.textContent =
    "✅ Invitation verified. Create your password.";

  statusBox.style.background =
    "#dcfce7";

  statusBox.style.color =
    "#166534";

  form.style.display =
    "block";
}


function showError(text) {

  statusBox.textContent =
    text;

  statusBox.style.background =
    "#fee2e2";

  statusBox.style.color =
    "#991b1b";
}


function showMessage(text, type) {

  msg.textContent =
    text;

  msg.className =
    type;

}


/* --------------------------------
   HANDLE AUTH CALLBACK
-------------------------------- */

async function processAuthCallback() {

  try {

    /* 1. Check existing session */

    const {
      data: sessionData
    } = await sb.auth.getSession();

    if (sessionData?.session) {

      showForm();

      return true;
    }


    /* 2. Handle PKCE ?code= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      params.get("code");

    if (code) {

      const {
        data,
        error
      } =
        await sb.auth.exchangeCodeForSession(
          code
        );

      if (error) {

        console.error(
          "CODE EXCHANGE ERROR:",
          error
        );

        showError(
          "Invitation verification failed: " +
          error.message
        );

        return false;
      }

      if (data?.session) {

        showForm();

        return true;
      }
    }


    /* 3. Handle hash access_token */

    const hash =
      window.location.hash.startsWith("#")
        ? window.location.hash.substring(1)
        : window.location.hash;

    const hashParams =
      new URLSearchParams(hash);

    const accessToken =
      hashParams.get(
        "access_token"
      );

    const refreshToken =
      hashParams.get(
        "refresh_token"
      );


    if (
      accessToken &&
      refreshToken
    ) {

      const {
        data,
        error
      } =
        await sb.auth.setSession({

          access_token:
            accessToken,

          refresh_token:
            refreshToken

        });


      if (error) {

        console.error(
          "HASH SESSION ERROR:",
          error
        );

        showError(
          error.message
        );

        return false;
      }


      if (data?.session) {

        showForm();

        return true;
      }
    }


    /* 4. Handle token_hash */

    const tokenHash =
      params.get(
        "token_hash"
      );

    const tokenType =
      params.get("type");


    if (
      tokenHash &&
      tokenType
    ) {

      const {
        data,
        error
      } =
        await sb.auth.verifyOtp({

          token_hash:
            tokenHash,

          type:
            tokenType

        });


      if (error) {

        console.error(
          "OTP VERIFY ERROR:",
          error
        );

        showError(
          error.message
        );

        return false;
      }


      if (data?.session) {

        showForm();

        return true;
      }
    }


    /* 5. Listen for automatic Auth event */

    return await new Promise(
      (resolve) => {

        let finished = false;

        const timeout =
          setTimeout(() => {

            if (!finished) {

              finished = true;

              showError(
                "Invitation session was not found. Please open the latest invitation email again."
              );

              resolve(false);
            }

          }, 5000);


        sb.auth.onAuthStateChange(
          (event, session) => {

            console.log(
              "AUTH EVENT:",
              event
            );

            if (
              session &&
              session.user &&
              !finished
            ) {

              finished = true;

              clearTimeout(timeout);

              showForm();

              resolve(true);
            }

          }
        );

      }
    );

  } catch (error) {

    console.error(
      "AUTH CALLBACK ERROR:",
      error
    );

    showError(
      error.message ||
      "Unable to process invitation."
    );

    return false;
  }
}


/* --------------------------------
   PASSWORD SUBMIT
-------------------------------- */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const p1 =
      password.value.trim();

    const p2 =
      confirmPassword.value.trim();


    if (p1.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    if (p1 !== p2) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "Creating Password...";


    const {
      data,
      error
    } =
      await sb.auth.updateUser({

        password:
          p1

      });


    if (error) {

      console.error(
        "PASSWORD UPDATE ERROR:",
        error
      );

      showMessage(
        error.message,
        "error"
      );

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Create Password & Continue";

      return;
    }


    console.log(
      "PASSWORD UPDATED:",
      data
    );


    showMessage(
      "✅ Password created successfully. Redirecting to dashboard...",
      "success"
    );


    setTimeout(
      () => {

        window.location.href =
          "dashboard.html";

      },
      1200
    );

  }
);


/* START */

processAuthCallback();

</script>

</body>

</html>
