<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Set Password | MOHIT CAREERX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #071a3d;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .brand {
      color: #2563eb;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 {
      color: #071a3d;
      margin: 0 0 12px;
    }

    p {
      color: #4b5563;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 700;
      color: #111827;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    #msg {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.5;
    }

    #msg.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #msg.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    #passwordForm {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="brand">
    MOHIT CAREERX
  </div>

  <h1>🔐 Create Your Password</h1>

  <p>
    Your student account invitation has been accepted.
    Please create a password to continue to your student dashboard.
  </p>

  <div id="status">
    Verifying your invitation...
  </div>

  <form id="passwordForm">

    <label for="password">
      New Password
    </label>

    <input
      id="password"
      type="password"
      minlength="6"
      autocomplete="new-password"
      placeholder="Enter your password"
      required
    >

    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      id="confirmPassword"
      type="password"
      minlength="6"
      autocomplete="new-password"
      placeholder="Re-enter your password"
      required
    >

    <button id="saveBtn" type="submit">
      Create Password & Continue
    </button>

  </form>

  <div id="msg"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const sb = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const statusBox =
  document.getElementById("status");

const form =
  document.getElementById("passwordForm");

const password =
  document.getElementById("password");

const confirmPassword =
  document.getElementById("confirmPassword");

const saveBtn =
  document.getElementById("saveBtn");

const msg =
  document.getElementById("msg");


function showMessage(text, type) {

  msg.textContent = text;
  msg.className = type;

}


function showForm() {

  statusBox.textContent =
    "Invitation verified. Please create your password.";

  statusBox.style.background = "#dcfce7";
  statusBox.style.color = "#166534";

  form.style.display = "block";

}


function showError(text) {

  statusBox.textContent = text;

  statusBox.style.background = "#fee2e2";
  statusBox.style.color = "#991b1b";

  form.style.display = "none";

}


/*
  IMPORTANT:
  Supabase invitation can return the auth session
  through the URL. We wait for the auth event first.
*/

let sessionReady = false;

sb.auth.onAuthStateChange(async (event, session) => {

  console.log(
    "AUTH EVENT:",
    event,
    session ? "SESSION FOUND" : "NO SESSION"
  );

  if (session && session.user) {

    sessionReady = true;

    showForm();

  }

});


async function checkExistingSession() {

  try {

    const {
      data,
      error
    } = await sb.auth.getSession();

    if (error) {

      console.error(error);

      return false;

    }

    if (data.session && data.session.user) {

      sessionReady = true;

      showForm();

      return true;

    }

  } catch (err) {

    console.error(err);

  }

  return false;

}


/*
  Wait for Supabase to process the invitation URL.
*/

async function initializeAuth() {

  statusBox.textContent =
    "Verifying your invitation...";

  const existing =
    await checkExistingSession();

  if (existing) {
    return;
  }

  /*
    Give Supabase time to process
    the invitation URL.
  */

  let attempts = 0;

  const timer =
    setInterval(async () => {

      attempts++;

      const ok =
        await checkExistingSession();

      if (ok || attempts >= 20) {

        clearInterval(timer);

        if (!ok) {

          showError(
            "Invitation session could not be verified. Please open the invitation email link again."
          );

        }

      }

    }, 500);

}


form.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    if (!sessionReady) {

      showMessage(
        "Your invitation is still being verified. Please wait a moment.",
        "error"
      );

      return;

    }

    const p1 =
      password.value.trim();

    const p2 =
      confirmPassword.value.trim();


    if (p1.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;

    }


    if (p1 !== p2) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    saveBtn.disabled = true;

    saveBtn.textContent =
      "Creating Password...";


    try {

      const {
        data,
        error
      } = await sb.auth.updateUser({
        password: p1
      });


      if (error) {

        console.error(
          "PASSWORD UPDATE ERROR:",
          error
        );

        showMessage(
          error.message,
          "error"
        );

        saveBtn.disabled = false;

        saveBtn.textContent =
          "Create Password & Continue";

        return;

      }


      console.log(
        "PASSWORD UPDATED:",
        data
      );


      showMessage(
        "✅ Password created successfully. Opening your dashboard...",
        "success"
      );


      /*
        Make sure the new session is refreshed
        before going to dashboard.
      */

      await sb.auth.refreshSession();


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 1500);


    } catch (err) {

      console.error(err);

      showMessage(
        err.message ||
        "Something went wrong while creating your password.",
        "error"
      );

      saveBtn.disabled = false;

      saveBtn.textContent =
        "Create Password & Continue";

    }

  }
);


initializeAuth();

</script>

</body>
</html>
